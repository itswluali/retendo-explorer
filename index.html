<style>

}

  --sage:#9AB594; --sage-deep:#B9D1B3; --sage-soft:rgba(154,181,148,.16);

  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1D1B; --stage-hi:#272B28; --stage-lo:#141715;
  --surface:rgba(33,37,34,.9); --surface-solid:#222623;
  --ink:#ECE8DF; --muted:#A4A99F; --line:rgba(236,232,223,.13);
  --sage:#9AB594; --sage-deep:#B9D1B3; --sage-soft:rgba(154,181,148,.16);

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}

.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 62% at 50% 44%,var(--stage-hi) 0%,var(--stage-lo) 100%)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border:0;border-radius:999px;background:none;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}

/* ---------- helpers ---------- */
const M = o => new THREE.MeshStandardMaterial(o);
function buildIndexed(pos, segs, rad){
  const idx = [];
  for (let i=0;i<segs;i++) for (let j=0;j<rad;j++){ const a=i*(rad+1)+j, b=a+rad+1; idx.push(a,a+1,b, b,a+1,b+1); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx); geo.computeVertexNormals(); return geo;
}
function sweepZ(fn, segs, rad){
  const pos = [];
  for (let i=0;i<=segs;i++){ const s = fn(i/segs); for (let j=0;j<=rad;j++){ const a=j/rad*PI*2; pos.push(s[0]+Math.cos(a)*s[3], s[1]+Math.sin(a)*s[4], s[2]); } }
  return buildIndexed(pos, segs, rad);
}
function sweepCurve(curve, rFn, segs, rad){
  const fr = curve.computeFrenetFrames(segs,false), pos = [], p = new THREE.Vector3();
  for (let i=0;i<=segs;i++){ const t=i/segs; curve.getPointAt(t,p); const N=fr.normals[i], B=fr.binormals[i], r=rFn(t);
    for (let j=0;j<=rad;j++){ const a=j/rad*PI*2, c=Math.cos(a), s=Math.sin(a); pos.push(p.x+(N.x*c+B.x*s)*r, p.y+(N.y*c+B.y*s)*r, p.z+(N.z*c+B.z*s)*r); } }
  return buildIndexed(pos, segs, rad);
}
function fnCurve(f){ const c = new THREE.Curve(); c.getPoint = (t,o) => f(t, o||new THREE.Vector3()); return c; }
function canvasTex(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t; }
const shadowTex = canvasTex(128,128,(g)=>{ const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,'rgba(38,43,39,.32)'); r.addColorStop(.6,'rgba(38,43,39,.1)'); r.addColorStop(1,'rgba(38,43,39,0)'); g.fillStyle=r; g.fillRect(0,0,128,128); });
function shadow(w,d,y){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d), new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,toneMapped:false})); m.rotation.x=-PI/2; m.position.y=y; m.renderOrder=-1; return m; }
// two half-shells along z, split at the x=0 plane
function halves(r, len, mat, seg){
  return [0,PI].map(th=>new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,seg||64,1,true,th,PI).rotateX(PI/2), mat));
}
function openHalves(hs, e, dist, tilt){
  hs[0].position.x = dist*e; hs[1].position.x = -dist*e;
  hs[0].rotation.y = -tilt*e; hs[1].rotation.y = tilt*e;
}
function hexPack(sp, R){ const out=[]; for (let j=-12;j<=12;j++) for (let i=-12;i<=12;i++){ const x=(i+(j%2?.5:0))*sp, y=j*sp*.866; if (Math.hypot(x,y)<=R) out.push([x,y]); } return out; }
function topOf(arr, fx, fy){ let b=0; arr.forEach((a,i)=>{ const y=fy(a), by=fy(arr[b]); if (y>by+1e-6 || (Math.abs(y-by)<1e-6 && Math.abs(fx(a))<Math.abs(fx(arr[b])))) b=i; }); return b; }

const tags = [], tagLayer = $('#tags');
function tag(gi, parent, local, text, ltr, steps){
  const a = new THREE.Object3D(); a.position.copy(local); parent.add(a);
  const el = document.createElement('div'); el.className='tag'; el.hidden = true;
  el.innerHTML = '<b></b><span'+(ltr?' dir="ltr"':'')+'>'+text+'</span>';
  tagLayer.appendChild(el); tags.push({gi, a, el, steps});
}

/* ---------- G0 · whole suture with needle ---------- */
function G0(){
  const g = new THREE.Group(), tr = .075;
  const path = new THREE.CatmullRomCurve3([V(-4.2,-.3,-1.2),V(-3,.25,-.4),V(-1.6,.1,.4),V(0,-.15,.5),V(1.4,.05,.1),V(2.4,.2,-.3)]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(path,300,tr,24,false), M({color:0xDCC8A2, roughness:.3})));
  const end = path.getPointAt(1);
  const R = .9, a0 = PI, span = PI*.75, C = end.clone().add(V(R,0,0));
  const nc = fnCurve((t,o)=>{ const a=a0-span*t; return o.set(C.x+R*Math.cos(a), C.y, C.z+R*Math.sin(a)); });
  const nr = t => t<.08 ? .1 : t<.12 ? .1-.03*(t-.08)/.04 : t<.8 ? .07 : .07*Math.max(.04,1-(t-.8)/.2);
  g.add(new THREE.Mesh(sweepCurve(nc,nr,160,20), M({color:0xC8CCCA, metalness:1, roughness:.2, side:THREE.DoubleSide})));
  g.add(shadow(9,4,-1.1));
  tag(0, g, path.getPointAt(.35).add(V(0,tr+.02,0)), 'الخيط');
  tag(0, g, nc.getPoint(.55).add(V(0,.09,0)), 'الإبرة');
  g.userData.dive = () => path.getPointAt(.55);
  return {group:g, cam:{pos:V(.6,2.2,6.8), target:V(-.6,-.1,0)}, apply(){}};
}

/* ---------- G1 · suture cutaway ---------- */
function G1(){
  const g = new THREE.Group();
  const coat = halves(1.2, 6, M({color:0xEDE3CC, roughness:.22, side:THREE.DoubleSide}), 72); coat.forEach(m=>g.add(m));
  const matM = M({color:0xD6C39E, roughness:.55, transparent:true, opacity:.55, depthWrite:false, side:THREE.DoubleSide});
  const mat = halves(1.07, 5.9, matM, 72); mat.forEach(m=>{ m.renderOrder=2; g.add(m); });
  const pos = hexPack(.155,.93);
  const fib = new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,18).rotateX(PI/2), M({color:0xffffff, roughness:.45}), pos.length);
  fib.frustumCulled = false;
  const info = [], c1 = new THREE.Color(0xD3BF98), c2 = new THREE.Color(0xEADFC6), tmp = new THREE.Color();
  pos.forEach(([x,y],i)=>{ const s=.066*(.88+rand()*.24), len=5.8+rand()*.3; info.push({x,y,s,len,r:Math.hypot(x,y)}); fib.setColorAt(i,tmp.copy(c1).lerp(c2,rand())); });
  g.add(fib);
  const dm = new THREE.Object3D();
  const top = info[topOf(info, f=>f.x, f=>f.y)];
  // genipin crosslinks: short amber bridges between neighbouring collagen bundles (design concept, shown on the crosslinks step only)
  const pairs = [];
  for (let i=0;i<info.length;i++) for (let j=i+1;j<info.length;j++){
    const a=info[i], b=info[j];
    if (Math.hypot(a.x-b.x,a.y-b.y) < .155*1.08 && rand() < .55){ for (let k=0;k<3;k++) pairs.push({i, j, z:-2.3+4.6*rand()}); }
  }
  const links = new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,10), M({color:0xC9973A, roughness:.35}), pairs.length);
  links.frustumCulled = false; links.visible = false;
  const lm = new THREE.Object3D(), la = new THREE.Object3D(); g.add(links, la);
  const kOf = (f,e) => 1+.9*e*(.4+f.r);
  function setL(e){
    pairs.forEach((q,n)=>{ const a=info[q.i], b=info[q.j], ka=kOf(a,e), kb=kOf(b,e);
      const ax=a.x*ka, ay=a.y*ka, bx=b.x*kb, by=b.y*kb, len=Math.hypot(bx-ax,by-ay);
      lm.position.set((ax+bx)/2,(ay+by)/2,q.z); lm.rotation.z = Math.atan2(by-ay,bx-ax)-PI/2; lm.scale.set(.02,Math.max(.01,len),.02);
      lm.updateMatrix(); links.setMatrixAt(n,lm.matrix); });
    links.instanceMatrix.needsUpdate = true;
    const q = pairs.reduce((best,p)=>{ const y=(info[p.i].y+info[p.j].y)/2; return y>best.y ? {p,y} : best; }, {p:pairs[0], y:-1e9}).p;
    if (q){ const a=info[q.i], b=info[q.j]; la.position.set((a.x*kOf(a,e)+b.x*kOf(b,e))/2,(a.y*kOf(a,e)+b.y*kOf(b,e))/2+.03,q.z); }
  }
  function setF(e){ info.forEach((f,i)=>{ const kk=1+.9*e*(.4+f.r); dm.position.set(f.x*kk,f.y*kk,0); dm.scale.set(f.s,f.s,f.len); dm.updateMatrix(); fib.setMatrixAt(i,dm.matrix); }); fib.instanceMatrix.needsUpdate = true; setL(e); }
  setF(0);
  tag(1, la, V(0,0,0), 'رابطة جينيبين', false, [5]);
  g.add(shadow(4,9,-1.6));
  tag(1, coat[0], V(.5,1.1,1.2), 'الطبقة الخارجية', false, [2,3]);
  tag(1, mat[1], V(-.75,-.7,2.6), 'مصفوفة رابطة', false, [4]);
  const fa = new THREE.Object3D(); g.add(fa);
  tag(1, fa, V(0,0,0), 'حزمة كولاجين', false, [4,5]);
  g.userData.dive = () => { const kk=1+.9*(.4+top.r); return g.localToWorld(V(top.x*kk, top.y*kk+top.s, .4)); };
  return {group:g, links, cam:{pos:V(5.4,3,6.4), target:V(0,0,.3)},
    apply(p){
      const e1 = sm(p), e2 = sm(p-1);
      openHalves(coat, e1, 1.9, .5); coat.forEach(m=>m.position.z = -.4*e1);
      openHalves(mat, e2, 1.25, .3); matM.opacity = .55*(1-.35*e2);
      setF(e2);
      const kk=1+.9*e2*(.4+top.r); fa.position.set(top.x*kk, top.y*kk+top.s+.02, 1.6);
    }};
}

/* ---------- G2 · collagen fibers in a bundle ---------- */
function G2(){
  const g = new THREE.Group(), parts = [];
  const shM = M({color:0xE9DEC6, roughness:.45, transparent:true, opacity:.5, depthWrite:false, side:THREE.DoubleSide});
  const sh = halves(1.15, 4.9, shM); sh.forEach(m=>{ m.renderOrder=3; g.add(m); });
  const fibM = M({color:0xE1D2B5, roughness:.5}), crossM = M({color:0xA9BEA2, roughness:.45});
  const fl = [];
  hexPack(.25,.9).forEach(([x,y])=>{
    const rr=.1*(.9+rand()*.2), ph=rand()*.6, amp=.06+rand()*.03;
    const m = new THREE.Mesh(sweepZ(t=>{ const z=-2.4+4.8*t, tp=endTaper(t,18); return [x+amp*Math.sin(z*5+ph), y+amp*.3*Math.cos(z*5+ph), z, rr*tp, rr*tp]; },150,10), fibM);
    g.add(m); parts.push({o:m, d:V(x,y,0).multiplyScalar(.85)}); fl.push({m,x,y,rr});
  });
  const top = fl[topOf(fl, f=>f.x, f=>f.y)];
  for (let k=0;k<5;k++){
    const th0=k*1.25+.3;
    const m = new THREE.Mesh(sweepZ(t=>{ const z=-2.2+4.4*t, th=th0+t*2.4, tp=endTaper(t,18); return [.99*Math.cos(th), .99*Math.sin(th), z, .075*tp, .075*tp]; },150,8), crossM);
    g.add(m); const mid=th0+1.2; parts.push({o:m, d:V(Math.cos(mid),Math.sin(mid),0).multiplyScalar(1.05)});
    if (k===1) tag(2, m, V(1.06*Math.cos(mid),1.06*Math.sin(mid),0), 'ألياف متشابكة');
  }
  g.add(shadow(3.4,7,-1.4));
  tag(2, top.m, V(top.x, top.y+top.rr+.03, 1.2), 'ليف كولاجين');
  tag(2, sh[0], V(.75,.8,-1.4), 'غلاف الحزمة');
  g.userData.dive = () => top.m.localToWorld(V(top.x, top.y+top.rr, .2));
  return {group:g, cam:{pos:V(3.8,2.3,5.4), target:V(0,0,.2)},
    apply(p){ const e=sm(p); openHalves(sh, e, 1.6, .45); shM.opacity=.5*(1-.4*e); parts.forEach(q=>q.o.position.copy(q.d).multiplyScalar(e)); }};
}

/* ---------- G3 · fibrils ---------- */
const dTex = canvasTex(16,128,(c)=>{
  c.fillStyle='#ECE2CB'; c.fillRect(0,0,16,128);
  c.fillStyle='#C2AC84'; c.fillRect(0,0,16,69);
  c.fillStyle='rgba(150,128,90,.5)'; [78,92,106,118].forEach(y=>c.fillRect(0,y,16,2));
});
function G3(){
  const g = new THREE.Group(), parts = [];
  const shM = M({color:0xDCCDAE, roughness:.5, transparent:true, opacity:.55, depthWrite:false, side:THREE.DoubleSide});
  const sh = halves(1.2, 4.8, shM); sh.forEach(m=>{ m.renderOrder=3; g.add(m); });
  const geo = new THREE.CylinderGeometry(.19,.19,4.5,40,1).rotateX(PI/2);
  hexPack(.42,1.0).forEach(([x,y])=>{
    const tex = dTex.clone(); tex.needsUpdate=true; tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,12); tex.offset.y=rand();
    const m = new THREE.Mesh(geo, M({map:tex, roughness:.5})); const z=(rand()-.5)*.4; m.position.set(x,y,z);
    g.add(m); parts.push({o:m, x, y, d:V(x,y,0).multiplyScalar(.75), b:V(x,y,z)});
  });
  const top = parts[topOf(parts, q=>q.x, q=>q.y)];
  g.add(shadow(3.4,7,-1.4));
  tag(3, top.o, V(0,.2,1.3), 'ليفة');
  tag(3, parts[0].o, V(0,-.2,-.6), 'D ≈ 67 nm', true);
  g.userData.dive = () => top.o.localToWorld(V(0,.19,.3));
  return {group:g, cam:{pos:V(3.6,2.1,5.2), target:V(0,0,.2)},
    apply(p){ const e=sm(p); openHalves(sh, e, 1.6, .45); shM.opacity=.55*(1-.4*e); parts.forEach(q=>q.o.position.copy(q.b).addScaledVector(q.d,e)); }};
}

/* ---------- G4 · staggered tropocollagen in a fibril ---------- */
function G4(){
  const g = new THREE.Group();
  const D = .5, Lm = 4.4*D, Zh = 2.6;
  const tex = dTex.clone(); tex.needsUpdate=true; tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(1,(2*Zh)/D);
  const sh = halves(1.05, 2*Zh, M({map:tex, roughness:.5, side:THREE.DoubleSide})); sh.forEach(m=>g.add(m));
  const list = [];
  hexPack(.17,.9).forEach(([x,y],ri)=>{
    const off = ((ri*3)%5)*D;
    for (let s=-Zh-5*D+off; s<Zh; s+=5*D){ const a=Math.max(s,-Zh), b=Math.min(s+Lm,Zh); if (b-a>.15) list.push({x,y,z:(a+b)/2,len:b-a}); }
  });
  const rods = new THREE.InstancedMesh(new THREE.CylinderGeometry(1,1,1,10).rotateX(PI/2), M({color:0xffffff, roughness:.45}), list.length); rods.frustumCulled=false;
  const c1 = new THREE.Color(0xD9C59F), c2 = new THREE.Color(0xBFA77D), tmp = new THREE.Color();
  list.forEach((r,i)=> rods.setColorAt(i, tmp.copy(c1).lerp(c2,rand()*.6)));
  g.add(rods);
  const dm = new THREE.Object3D();
  function setR(e){ list.forEach((r,i)=>{ const k=1+.55*e; dm.position.set(r.x*k,r.y*k,r.z); dm.scale.set(.055,.055,r.len); dm.updateMatrix(); rods.setMatrixAt(i,dm.matrix); }); rods.instanceMatrix.needsUpdate=true; }
  setR(0);
  const tops = list.filter(r=>r.y>=Math.max(...list.map(q=>q.y))-1e-6);
  const top = tops.reduce((a,b)=> Math.abs(b.z)+Math.abs(b.x) < Math.abs(a.z)+Math.abs(a.x) ? b : a);
  g.add(shadow(3.4,7,-1.4));
  const ta = new THREE.Object3D(); g.add(ta);
  tag(4, ta, V(0,0,0), 'جزيء كولاجين');
  tag(4, sh[0], V(.65,.8,-1.6), 'سطح الليفة');
  g.userData.dive = () => g.localToWorld(V(top.x*1.55, top.y*1.55+.055, top.z));
  return {group:g, cam:{pos:V(3.5,2.2,5.4), target:V(0,0,0)},
    apply(p){ const e=sm(p); openHalves(sh, e, 1.6, .45); setR(e); const k=1+.55*e; ta.position.set(top.x*k, top.y*k+.07, top.z); }};
}

/* ---------- G5 · triple helix ---------- */
function G5(){
  const g = new THREE.Group(), R=.3, turns=2.6, z0=-2.1, Lz=4.2, chains=[];
  const cols = [0x8DA987,0x9FB898,0xD1BC94], names=['α1','α1','α2'];
  const sph = new THREE.SphereGeometry(1,12,8), dm = new THREE.Object3D(), glyM = M({color:0x3F4440, roughness:.5});
  for (let k=0;k<3;k++){
    const ph=k*2*PI/3, grp=new THREE.Group(); g.add(grp);
    const curve = fnCurve((t,o)=>{ const a=ph+2*PI*turns*t; return o.set(R*Math.cos(a), R*Math.sin(a), z0+Lz*t); });
    grp.add(new THREE.Mesh(new THREE.TubeGeometry(curve,300,.1,12,false), M({color:cols[k], roughness:.4})));
    const gly = new THREE.InstancedMesh(sph, glyM, 27), xy = new THREE.InstancedMesh(sph, M({color:new THREE.Color(cols[k]).lerp(new THREE.Color(0xffffff),.35), roughness:.45}), 54);
    let gi=0, xi=0;
    for (let m=0;m<81;m++){ const t=(m+.5)/81, a=ph+2*PI*turns*t+(m%3)*.12, z=z0+Lz*t;
      if (m%3===0){ const r=R*.42; dm.position.set(r*Math.cos(a),r*Math.sin(a),z); dm.scale.setScalar(.07); dm.updateMatrix(); gly.setMatrixAt(gi++,dm.matrix); }
      else { const r=R+.1+(m%3===2?.03:0); dm.position.set(r*Math.cos(a),r*Math.sin(a),z); dm.scale.setScalar(.08); dm.updateMatrix(); xy.setMatrixAt(xi++,dm.matrix); } }
    grp.add(gly, xy);
    chains.push({grp, d:V(Math.cos(ph),Math.sin(ph),0)});
    const ta = ph+2*PI*turns*(.8+k*.05); tag(5, grp, V((R+.14)*Math.cos(ta),(R+.14)*Math.sin(ta),z0+Lz*(.8+k*.05)), names[k], true);
  }
  tag(5, g, V(0,0,2.25), 'جلايسين');
  g.add(shadow(2.6,6,-1.3));
  return {group:g, cam:{pos:V(2.8,1.6,4.4), target:V(0,0,.1)},
    apply(p){ const e=sm(p); chains.forEach(c=>c.grp.position.copy(c.d).multiplyScalar(.22*e)); }};
}

/* ---------- G6 · camel tendon ---------- */
function G6(){
  const g = new THREE.Group(), R0=1.2, sx=1.35, sy=.82;
  const prof = t => (.82+.18*Math.sin(PI*t))*Math.pow(Math.max(0,1-Math.pow(Math.abs(2*t-1),8)),.35);
  const Z = t => -4+8*t;
  const streak = canvasTex(512,8,(c)=>{ c.fillStyle='#fff'; c.fillRect(0,0,512,8); for (let i=0;i<150;i++){ c.fillStyle='rgba(150,132,100,'+(.06+rand()*.16)+')'; c.fillRect(rand()*512,0,1+rand()*2,8); } });
  streak.wrapS=streak.wrapT=THREE.RepeatWrapping; streak.repeat.set(5,1);
  const shM = M({color:0xF1EADB, map:streak, roughness:.3, transparent:true, opacity:.5, depthWrite:false, side:THREE.DoubleSide});
  const sheath = new THREE.Mesh(sweepZ(t=>[0,0,Z(t),R0*sx*prof(t),R0*sy*prof(t)],180,72), shM); sheath.renderOrder=4; g.add(sheath);
  const offs=[]; for (let i=0;i<8;i++){ const a=(i*45+22.5)*PI/180; offs.push([.66*Math.cos(a),.66*Math.sin(a)]); } offs.push([.3,0],[-.3,0]);
  const rf=.23*R0;
  const fc=(o,t)=>{ const tw=.35*(t-.5),c=Math.cos(tw),s=Math.sin(tw),p=prof(t); return [(o[0]*c-o[1]*s)*sx*R0*p,(o[0]*s+o[1]*c)*sy*R0*p,Z(t),p]; };
  const shellM = M({color:0xE7DDC8, roughness:.4, transparent:true, opacity:.32, depthWrite:false, side:THREE.DoubleSide});
  const fibM = M({color:0xDCC9A3, roughness:.5});
  const fascs=[];
  offs.forEach((o,fi)=>{
    const grp=new THREE.Group(); g.add(grp);
    const shell=new THREE.Mesh(sweepZ(t=>{ const f=fc(o,t); return [f[0],f[1],f[2],rf*f[3],rf*f[3]]; },140,28), shellM); shell.renderOrder=3; grp.add(shell);
    const loc=[[0,0]]; for (let k=0;k<5;k++){ const a=k*72*PI/180+fi; loc.push([.17*Math.cos(a),.17*Math.sin(a)]); }
    loc.forEach(([lx,ly])=>{ const ph=rand()*6;
      grp.add(new THREE.Mesh(sweepZ(t=>{ const f=fc(o,t),tp=endTaper(t,30),p=f[3]; return [f[0]+lx*p+.022*Math.sin(f[2]*6+ph)*p, f[1]+ly*p, f[2], .085*p*tp, .085*p*tp]; },150,8), fibM)); });
    fascs.push({grp, d:V(o[0]*sx,o[1]*sy,0).normalize()});
  });
  g.add(shadow(4.4,10,-1.32));
  tag(6, sheath, V(0,R0*sy*prof(.3)+.01,Z(.3)), 'غلاف الوتر');
  { const f=fc(offs[2],.62); tag(6, fascs[2].grp, V(f[0],f[1]+rf*f[3],f[2]), 'حزمة ليفية'); }
  { const f=fc(offs[8],.7); tag(6, fascs[8].grp, V(f[0],f[1],f[2]), 'ألياف الكولاجين'); }
  return {group:g, cam:{pos:V(6.6,3,7.6), target:V(0,0,.3)},
    apply(p){ const e=sm(p); fascs.forEach(f=>f.grp.position.copy(f.d).multiplyScalar(.75*e)); shM.opacity=.5*(1-.7*e); sheath.scale.set(1+.3*e,1+.3*e,1); }};
}

const groups = [G0(),G1(),G2(),G3(),G4(),G5(),G6()];
groups.forEach((G,i)=>{ G.p=0; G.pT=0; G.group.visible = i===STEPS[0].g; scene.add(G.group); G.apply(0); G.group.updateMatrixWorld(true); });

/* ---------- UI ---------- */
let cur = 0, busy = false, W = 1, H = 1, playing = false, playTimer = 0;
const rail = $('#rail'), cap = $('#cap'), veil = $('#veil');
STEPS.forEach((s,i)=>{
  if (i){ const l=document.createElement('span'); l.className='rl'; rail.appendChild(l); }
  const b=document.createElement('button'); b.className='rs'; b.type='button';
  b.innerHTML='<i></i><span class="t">'+s.name+'</span>';
  b.setAttribute('aria-label', (i+1)+'. '+s.name);
  b.addEventListener('click', ()=>{ stopPlay(); go(i); });
  rail.appendChild(b);
});
function ui(){
  rail.querySelectorAll('.rs').forEach((b,i)=>{ b.classList.toggle('done', i<cur); if (i===cur) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  const s = STEPS[cur];
  if (groups[1] && groups[1].links) groups[1].links.visible = (STEPS[cur].en==='Genipin crosslinks');
  cap.innerHTML = '<div class="row"><span>'+(cur+1)+' / '+STEPS.length+'</span><span>'+s.scale+'</span></div>'+
    '<h2>'+s.name+'</h2><div class="en">'+s.en+'</div>'+
    '<span class="chip '+s.kind+'">'+(s.kind==='known'?'معروف علميًا':'تصوّر تصميمي')+'</span><p>'+s.text+'</p>';
  $('#bOut').disabled = cur===0;
  $('#bIn').disabled = cur===STEPS.length-1;
  const cb = rail.querySelector('[aria-current]');
  if (cb && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = cb.offsetLeft - rail.clientWidth/2 + cb.offsetWidth/2;
}

/* ---------- camera / tweens ---------- */
const tweens = [];
const ease = k => k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
function tween(dur, fn){ return new Promise(res=>tweens.push({t0:performance.now(), dur:RM?1:dur, fn, res})); }
function camFor(gi){
  const c = groups[gi].cam, pos = c.pos.clone(), tgt = c.target.clone(), asp = W/H;
  if (asp < 1.25){ const k = Math.min(2.2, 1.25/asp); pos.sub(tgt).multiplyScalar(k).add(tgt); }
  return {pos, tgt};
}
function flyTo(pos, tgt, dur){
  const p0 = camera.position.clone(), t0 = controls.target.clone(); controls.enabled = false;
  return tween(dur, k=>{ const e=ease(k); camera.position.lerpVectors(p0,pos,e); controls.target.lerpVectors(t0,tgt,e); camera.lookAt(controls.target); })
    .then(()=>{ controls.enabled = true; controls.update(); });
}
function limits(gi){ const {pos,tgt}=camFor(gi); controls.minDistance=.6; controls.maxDistance=pos.distanceTo(tgt)*2.2; }

async function go(n){
  if (busy || n===cur || n<0 || n>=STEPS.length) return;
  busy = true;
  const from = STEPS[cur], to = STEPS[n];
  const Gf = groups[from.g], Gt = groups[to.g];
  if (from.g === to.g){
    cur = n; ui(); Gt.pT = to.p;
    const {pos,tgt} = camFor(to.g); await flyTo(pos,tgt,900);
  } else if (n > cur){
    // inward: open the current layer, dive into the child, swap
    if (from.g === 1 && Gf.pT < 2){ Gf.pT = 2; await tween(700, ()=>{}); }
    else if (from.g > 1 && Gf.pT < 1){ Gf.pT = 1; await tween(500, ()=>{}); }
    Gf.group.updateMatrixWorld(true);
    const dive = Gf.group.userData.dive ? Gf.group.userData.dive() : controls.target.clone();
    const dir = camera.position.clone().sub(dive).normalize();
    await flyTo(dive.clone().addScaledVector(dir,.35), dive, 950);
    await tween(220, k=> veil.style.opacity = k);
    Gf.group.visible = false;
    cur = n; ui();
    Gt.group.visible = true; Gt.p = 0; Gt.pT = 0; Gt.apply(0);
    const {pos,tgt} = camFor(to.g);
    camera.position.copy(pos.clone().sub(tgt).multiplyScalar(.12).add(tgt)); controls.target.copy(tgt); camera.lookAt(tgt);
    limits(to.g);
    tween(450, k=> veil.style.opacity = 1-k);
    await flyTo(pos, tgt, 1300);
    Gt.pT = to.p;
    if (to.p > 0) await tween(800, ()=>{});
  } else {
    // outward: close and pull back out
    await tween(220, k=> veil.style.opacity = k);
    Gf.group.visible = false; Gf.p = Gf.pT = 0; Gf.apply(0);
    cur = n; ui();
    Gt.group.visible = true; Gt.p = Gt.pT = to.p; Gt.apply(to.p); Gt.group.updateMatrixWorld(true);
    const {pos,tgt} = camFor(to.g);
    const d = Gt.group.userData.dive ? Gt.group.userData.dive() : tgt.clone();
    camera.position.copy(d.clone().add(pos.clone().sub(tgt).normalize().multiplyScalar(.4))); controls.target.copy(d); camera.lookAt(d);
    limits(to.g);
    tween(400, k=> veil.style.opacity = 1-k);
    await flyTo(pos, tgt, 1200);
  }
  busy = false;
  if (playing) playTimer = setTimeout(()=>{ if (!playing) return; if (cur < STEPS.length-1) go(cur+1); else stopPlay(); }, 2400);
}
function stopPlay(){ playing=false; clearTimeout(playTimer); $('#bPlay').setAttribute('aria-pressed','false'); }

$('#bIn').addEventListener('click', ()=>{ stopPlay(); go(cur+1); });
$('#bOut').addEventListener('click', ()=>{ stopPlay(); go(cur-1); });
$('#bPlay').addEventListener('click', async ()=>{
  if (playing){ stopPlay(); return; }
  if (busy) return;
  playing = true; $('#bPlay').setAttribute('aria-pressed','true');
  if (cur === STEPS.length-1){
    busy = true;
    await tween(250, k=> veil.style.opacity=k);
    groups.forEach((G,i)=>{ G.group.visible = i===STEPS[0].g; G.p=G.pT=0; G.apply(0); });
    cur = 0; ui(); const {pos,tgt}=camFor(STEPS[0].g); camera.position.copy(pos); controls.target.copy(tgt); camera.lookAt(tgt); limits(STEPS[0].g);
    await tween(400, k=> veil.style.opacity=1-k);
    busy = false;
    playTimer = setTimeout(()=>{ if (playing) go(1); }, 1600);
  } else go(cur+1);
});
$('#bRot').addEventListener('click', ()=>{ controls.autoRotate=!controls.autoRotate; $('#bRot').setAttribute('aria-pressed', controls.autoRotate?'true':'false'); });
window.addEventListener('keydown', e=>{
  if (e.key==='ArrowLeft'){ stopPlay(); go(cur+1); }
  else if (e.key==='ArrowRight'){ stopPlay(); go(cur-1); }
});

/* ---------- loop ---------- */
function resize(){ const r=stage.getBoundingClientRect(); W=Math.max(1,r.width); H=Math.max(1,r.height); renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
{ const {pos,tgt}=camFor(STEPS[0].g); camera.position.copy(pos); controls.target.copy(tgt); camera.lookAt(tgt); limits(STEPS[0].g); }
ui();
const tv = new THREE.Vector3();
function frame(now){
  for (let i=tweens.length-1;i>=0;i--){ const tw=tweens[i], k=Math.min(1,(now-tw.t0)/tw.dur); tw.fn(k); if (k>=1){ tweens.splice(i,1); tw.res(); } }
  groups.forEach(G=>{ const d=G.pT-G.p; if (Math.abs(d)>1e-4){ G.p += RM ? d : Math.sign(d)*Math.min(Math.abs(d), Math.max(.012, Math.abs(d)*.07)); G.apply(G.p); } });
  if (controls.enabled) controls.update();
  renderer.render(scene,camera);
  const s = STEPS[cur];
  for (const t of tags){
    let show = !busy && t.gi===s.g && (!t.steps || t.steps.indexOf(cur)>=0) && groups[s.g].p > s.p - .15;
    if (!show){ if (!t.el.hidden) t.el.hidden = true; continue; }
    t.a.getWorldPosition(tv); tv.project(camera);
    if (tv.z>1 || Math.abs(tv.x)>1.02 || Math.abs(tv.y)>1.02){ t.el.hidden = true; continue; }
    t.el.hidden = false;
    t.el.style.transform = 'translate('+((tv.x+1)/2*W-6).toFixed(1)+'px,'+((1-tv.y)/2*H-11).toFixed(1)+'px)';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
